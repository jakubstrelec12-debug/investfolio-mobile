:root{--bg:#09111b;--card:#121e2a;--line:#293847;--text:#f4f8fc;--muted:#96a9b9;--mint:#a9edcf}
body{background:radial-gradient(ellipse at 60% -25%,#213b3e 0%,#09111b 58%) fixed}
main{max-width:1100px}
.head{margin-bottom:24px}.brand{font-size:25px;letter-spacing:-1.3px}
.head .small{font-size:10px;letter-spacing:1.2px}
.hero{background:linear-gradient(145deg,#203a3d 0%,#13232f 54%,#101a26 100%);border-color:#365457;padding:25px 23px;box-shadow:0 20px 70px #030a1240}
.hero .big{font-size:clamp(31px,8vw,52px);overflow-wrap:anywhere}
.card{background:linear-gradient(165deg,#172632,#111c29 100%);border-color:#283947}
.card h2{letter-spacing:-.5px}
.summary-kicker{color:#9eb3c0;font-size:12px;letter-spacing:.4px}
.dashboard-top{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
.dashboard-top .card,.dashboard-top .hero{margin:0}
.overview-chart{grid-column:1/-1}
.overview-chart .card{margin-top:14px}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.metric-tile{background:#ffffff0b;border:1px solid #ffffff10;border-radius:13px;padding:13px;min-width:0}
.metric-tile label{display:block;color:#adc0c9;font-size:11px;margin-bottom:7px}
.metric-tile strong{display:block;font-size:18px;letter-spacing:-.7px;overflow-wrap:anywhere}
.section-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-heading h2{margin:0}
.flow-steps{display:flex;justify-content:space-between;align-items:center;padding:10px 0;color:#9eabb9;font-size:11px}
.radar-status{background:linear-gradient(120deg,#263a38,#162631);border:1px solid #365950;border-radius:15px;padding:18px;margin:16px 0}
.radar-status .radar-eyebrow{font-size:10px;letter-spacing:1.1px;color:#b6d7cd;text-transform:uppercase}
.radar-status .radar-title{font-size:23px;line-height:1.2;font-weight:760;letter-spacing:-.7px;margin:8px 0}
.radar-indicator{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12;padding:13px 0;font-size:13px;gap:12px}
.radar-indicator:last-child{border-bottom:0}
.radar-indicator span{color:#adbdc9}
.radar-indicator strong{font-size:14px}
.radar-warning{color:#f6d39f;background:#3b2e25;padding:12px;border-radius:10px;font-size:12px;line-height:1.5;margin-top:12px}
.radar-sub{font-size:12px;color:#a8b7c4;line-height:1.6;margin:8px 0}
@media(max-width:750px){.dashboard-top{grid-template-columns:1fr}.overview-chart{grid-column:auto}.dashboard-top>.hero{margin-bottom:0}.dashboard-top>.card{margin:0}.metric-grid{margin-top:16px}.hero{padding:24px 19px}.card{padding:18px}.head{margin-bottom:20px}}

(()=>{'use strict';const KEY='investfolio.mobile.v1';const defaults={btcBudget:1000,etfPlan:3000,maxAllocation:20,sensitivity:'balanced',targetYears:20,annualReturn:7,inflation:2.5,currency:'CZK',notifications:false};let state={settings:{...defaults},transactions:[],quotes:{BTC:null,SPYI:null},updated:null};try{const stored=JSON.parse(localStorage.getItem(KEY));if(stored&&typeof stored==='object')state={...state,...stored,settings:{...defaults,...stored.settings}}}catch{}let page='home',tab='7d',chartMode='price',historyBusy=false,historyError='';const el=document.getElementById('app'),nav=document.getElementById('nav');const fmt=(n,d=0)=>Number(n||0).toLocaleString('cs-CZ',{minimumFractionDigits:d,maximumFractionDigits:d});const money=n=>fmt(n)+' Kč';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{return false}};const parseNumber=s=>Number(String(s??'').replace(/\s|\u00a0|\u202f|CZK|EUR|USD|€/g,'').replace(',','.'));const qty=s=>Math.max(0,state.transactions.filter(t=>t.symbol===s).reduce((a,t)=>a+(t.type==='sell'?-1:1)*t.quantity,0));const invested=s=>state.transactions.filter(t=>t.symbol===s).reduce((a,t)=>a+(t.type==='sell'?-1:1)*(t.value+t.fee),0);const value=s=>qty(s)*(state.quotes[s]?.price||0);const total=()=>value('BTC')+value('SPYI');const spend=()=>{let d=new Date(),month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return state.transactions.filter(t=>t.symbol==='BTC'&&t.type==='buy'&&t.date.startsWith(month)).reduce((a,t)=>a+t.value+t.fee,0)};const remaining=()=>Math.max(0,state.settings.btcBudget-spend());const navItems=[['home','⌂','Přehled'],['portfolio','◫','Portfolio'],['radar','◎','BTC Radar'],['future','↗','Budoucnost'],['settings','⚙','Nastavení']];function shell(body,title,sub){el.innerHTML=`<div class="head"><div class="brand"><i>◈</i> investfolio</div><span class="small">OSOBNÍ INVESTICE</span></div><div class="page-heading"><div class="eyebrow">${esc(title)}</div><h1>${esc(title)}</h1><p class="small" style="margin:0 0 22px">${sub}</p></div>${body}<p class="footer">Data uložená v tomto prohlížeči nejsou synchronizována s Revolutem. Nejde o investiční doporučení ani službu automatického obchodování.</p>`;nav.innerHTML=navItems.map(([k,i,l])=>`<button data-page="${k}" class="${page===k?'sel':''}"><span>${i}</span>${l}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();window.scrollTo(0,0)})}function graph(){const vals=[34,36,35,40,39,43,46,44,48,52,50,55,60,59,65,69,67,72,77,75];const pts=vals.map((v,i)=>`${i*600/(vals.length-1)},${110-v}`).join(' ');return `<svg class="graph" viewBox="0 0 600 132" preserveAspectRatio="none" aria-label="Dekorativní graf, bez skutečné historické výkonnosti"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a6ebd1" stop-opacity=".3"/><stop offset="1" stop-color="#a6ebd1" stop-opacity="0"/></linearGradient></defs><polygon points="0,132 ${pts} 600,132" fill="url(#g)"/><polyline points="${pts}" fill="none" stroke="#a6ebd1" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>`}function chartSeries(){const all=Array.isArray(state.historyBTC?.prices)?state.historyBTC.prices:[];const cut=Date.now()-(tab==='7d'?7:30)*86400000;return all.filter(p=>Array.isArray(p)&&p[0]>=cut&&Number.isFinite(p[1])&&p[1]>0).sort((a,b)=>a[0]-b[0]);}
function svgChart(series,amountMode){if(series.length<2)return '<div class="chart-unavailable">Historická cenová data zatím nejsou dostupná.<br>Zkus obnovit graf.</div>';const w=640,h=210,top=17,bottom=30,left=12,right=12,vals=series.map(p=>p[1]*(amountMode?qty('BTC'):1)),lo=Math.min(...vals),hi=Math.max(...vals),span=Math.max(1,hi-lo),min=lo-span*.14,max=hi+span*.14;let px=i=>left+(w-left-right)*i/(vals.length-1),py=v=>top+(h-top-bottom)*(max-v)/(max-min);const line=vals.map((v,i)=>(i?'L':'M')+px(i).toFixed(2)+' '+py(v).toFixed(2)).join(' ');const area=line+' L '+px(vals.length-1).toFixed(2)+' '+(h-bottom)+' L '+left+' '+(h-bottom)+' Z';const up=vals.at(-1)>=vals[0],color=up?'#a6ebd1':'#f19f9c';const grid=[0,.5,1].map(fr=>'<line x1="'+left+'" y1="'+(top+(h-top-bottom)*fr).toFixed(1)+'" x2="'+(w-right)+'" y2="'+(top+(h-top-bottom)*fr).toFixed(1)+'" stroke="#34404b" stroke-dasharray="3 7"/>').join('');return '<svg class="market-chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Skutečný historický graf ceny Bitcoinu, zdroj CoinGecko"><defs><linearGradient id="btcshade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="'+color+'" stop-opacity=".10"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+grid+'<path d="'+area+'" fill="url(#btcshade)"/><path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle cx="'+px(vals.length-1)+'" cy="'+py(vals.at(-1))+'" r="5" fill="'+color+'"/></svg>';}
function chartBlock(){const a=chartSeries(),v=chartMode==='holding',current=a.length?a.at(-1)[1]*(v?qty('BTC'):1):0,first=a.length?a[0][1]*(v?qty('BTC'):1):0,delta=first?100*(current-first)/first:0;return '<div class="card"><div class="row"><div><h2 style="margin-bottom:4px">Vývoj Bitcoinu</h2><div class="small">Skutečná tržní historie · CoinGecko</div></div><button class="btn secondary" id="reloadHistory" style="font-size:12px;padding:10px 12px">↻ Obnovit</button></div><div class="chart-toolbar"><div class="chart-actions"><button data-period="7d" class="'+(tab==='7d'?'active':'')+'">7 dní</button><button data-period="30d" class="'+(tab==='30d'?'active':'')+'">30 dní</button></div><select id="chartMode"><option value="price" '+(chartMode==='price'?'selected':'')+'>Cena BTC</option><option value="holding" '+(chartMode==='holding'?'selected':'')+'>Hodnota současných BTC</option></select></div>'+(a.length>=2?'<div class="chart-value">'+money(current)+'</div><div class="chart-change '+(delta>=0?'pos':'negative')+'">'+(delta>=0?'+':'')+fmt(delta,2)+' % za období</div>':'')+(historyBusy&&!a.length?'<div class="chart-unavailable">Načítám skutečné tržní ceny…</div>':svgChart(a,v))+(a.length>=2?'<div class="chart-foot"><span>'+new Date(a[0][0]).toLocaleDateString('cs-CZ')+'</span><span>'+new Date(a.at(-1)[0]).toLocaleDateString('cs-CZ')+'</span></div>':'')+'<p class="chart-note">'+(historyError?'Poslední obnovení se nezdařilo: '+esc(historyError)+'. Zobrazují se případná dříve uložená data. ': '')+(v?'Graf ukazuje, jak by se měnila hodnota tvého dnešního množství BTC při historických cenách. Není to historie skutečné hodnoty portfolia ani realizovaný výnos.':'Zobrazen je cenový vývoj BTC v CZK, nikoliv zisk tvých nákupů.')+'</p></div>';}
function bindCharts(){document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{tab=b.dataset.period;render()});const m=document.getElementById('chartMode');if(m)m.onchange=e=>{chartMode=e.target.value;render()};const btn=document.getElementById('reloadHistory');if(btn)btn.onclick=()=>refreshHistory(true);}
async function refreshHistory(force=false){if(historyBusy)return;const old=state.historyBTC?.at?Date.parse(state.historyBTC.at):0;if(!force&&Array.isArray(state.historyBTC?.prices)&&state.historyBTC.prices.length>3&&Date.now()-old<6*3600000)return;historyBusy=true;historyError='';render();try{const r=await fetch('https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=czk&days=30',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(!Array.isArray(j.prices)||j.prices.length<3)throw Error('Neúplná cenová data');state.historyBTC={prices:j.prices.filter(p=>Array.isArray(p)&&Number.isFinite(p[0])&&Number.isFinite(p[1])),at:new Date().toISOString()};if(!state.quotes.BTC?.price)state.quotes.BTC={price:j.prices.at(-1)[1],at:new Date().toISOString()};save()}catch(e){historyError=e.message||'Nedostupná služba'}finally{historyBusy=false;render()}}

function splitCsv(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
function revolutDate(d){d=String(d||'').trim();const iso=d.match(/^(\d{4})-(\d{2})-(\d{2})/);if(iso)return iso[1]+'-'+iso[2]+'-'+iso[3];const cz=d.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/);return cz?cz[3]+'-'+cz[2].padStart(2,'0')+'-'+cz[1].padStart(2,'0'):null}
function moneyField(v){const txt=String(v||'').trim(),currency=(txt.match(/\b(EUR|CZK|USD|GBP)\b/i)||[])[1]?.toUpperCase()||'';return{amount:parseNumber(txt),currency}}
function parseCsv(text){
const rows=splitCsv(text.replace(/^\ufeff/,'')),header=rows.shift()?.map(x=>x.trim())||[];
const cryptoCols=['Symbol','Type','Quantity','Price','Value','Fees','Date'];
const investCols=['Date','Ticker','Type','Quantity','Price per share','Total Amount','Currency','FX Rate'];
let format='',transactions=[],cashMovements=[],errors=[],skipped=[];
if(cryptoCols.every(x=>header.includes(x)))format='Revolut Crypto';
else if(investCols.every(x=>header.includes(x)))format='Revolut Investments';
else return{format:'Neznámý CSV',transactions,cashMovements,errors:['Nepodporované sloupce CSV: '+header.join(', ')],skipped};
for(let i=0;i<rows.length;i++){
const row=rows[i];if(!row.some(x=>String(x||'').trim()))continue;
const r=Object.fromEntries(header.map((x,j)=>[x,row[j]||''])),date=revolutDate(r.Date),type=String(r.Type||'').trim().toUpperCase();
if(!date){errors.push('Neplatné datum na řádku '+(i+2));continue}
if(format==='Revolut Crypto'){
const symbol=String(r.Symbol||'').toUpperCase(),side=/^(NÁKUP|BUY)$/.test(type)?'buy':/^(PRODEJ|SELL)$/.test(type)?'sell':null,q=parseNumber(r.Quantity),v=parseNumber(r.Value),fee=parseNumber(r.Fees);
if(!['BTC','SPYI'].includes(symbol)||!side||!(q>0)||!Number.isFinite(v)||!Number.isFinite(fee)){skipped.push('řádek '+(i+2)+' ('+type+')');continue}
const id='csv-'+[symbol,side,r.Quantity,r.Value,r.Fees,r.Date].join('|');
transactions.push({id,symbol,type:side,quantity:q,value:v,fee,date});continue;
}
const ticker=String(r.Ticker||'').trim().toUpperCase(),currency=String(r.Currency||'').trim().toUpperCase();
const amount=moneyField(r['Total Amount']),fx=parseNumber(r['FX Rate']);
const norm=type.replace(/\s+/g,' ');
const deposit=/^(CASH TOP.UP|DEPOSIT|TOP.UP|CASH DEPOSIT)$/.test(norm);
const withdrawal=/^(CASH WITHDRAWAL|WITHDRAWAL|CASH OUT)$/.test(norm);
const id='invest-'+[r.Date,r.Ticker,r.Type,r.Quantity,r['Price per share'],r['Total Amount'],r.Currency,r['FX Rate']].join('|');
if(deposit||withdrawal){
if(!(amount.amount>0)||!['EUR','CZK','USD','GBP'].includes(currency)){errors.push('Neplatný peněžní pohyb na řádku '+(i+2));continue}
if(currency!=='EUR'){skipped.push('řádek '+(i+2)+' (peněžní pohyb '+currency+', podporováno EUR)');continue}
cashMovements.push({id,date,label:deposit?'Vklad na investiční účet':'Výběr z investičního účtu',amount:amount.amount,direction:deposit?1:-1,currency:'EUR'});continue;
}
const side=/^(BUY|MARKET BUY|PURCHASE|STOCK BUY|ETF BUY)$/.test(norm)?'buy':/^(SELL|MARKET SELL|STOCK SELL|ETF SELL)$/.test(norm)?'sell':null;
if(!side){skipped.push('řádek '+(i+2)+' ('+norm+')');continue}
const q=parseNumber(r.Quantity);
if(ticker!=='SPYI'){skipped.push('řádek '+(i+2)+' (ticker '+ticker+' zatím nepodporován)');continue}
if(!(q>0)||!(amount.amount>0)){errors.push('Neplatný obchod na řádku '+(i+2));continue}
const tradeCurrency=amount.currency||currency;
let czk;
if(tradeCurrency==='CZK')czk=amount.amount;
else if(tradeCurrency==='EUR'&&fx>0&&fx<1)czk=amount.amount/fx;
else{skipped.push('řádek '+(i+2)+' (neověřený převod '+tradeCurrency+'/CZK)');continue}
transactions.push({id,symbol:ticker,type:side,quantity:q,value:czk,fee:0,date,sourceCurrency:tradeCurrency,sourceAmount:amount.amount,fxRate:fx,conversionNote:'Převod z výpisového FX Rate; poplatky nejsou v tomto CSV samostatně uvedené'});
}
return{format,transactions,cashMovements,errors,skipped};
}
function radar(){const a=radarAnalysis(),limit=state.settings.btcBudget,spent=spend();let limitNote=a.alloc===null?'Přesný podíl BTC zatím nelze vyhodnotit, protože chybí ceny některých pozic nebo portfolio není kompletní.':a.alloc>=state.settings.maxAllocation?'Podíl BTC dosahuje nastaveného maxima, přikupování vyžaduje zvýšenou opatrnost.':'Podíl BTC je pod nastaveným maximem.';shell('<div class="hero"><div class="eyebrow">BTC RADAR · AKTUÁLNÍ PŘEHLED</div><div class="summary-kicker" style="margin-top:13px">Bitcoin / CZK</div><div class="big">'+(state.quotes.BTC?.price?money(state.quotes.BTC.price):'—')+'</div><p class="small">Poslední dostupná cena z veřejného trhu. Vyhodnocení probíhá pouze při otevřené aplikaci.</p><button class="btn" id="btcRefresh">Obnovit cenu BTC</button></div>'+analyticsSummary()+chartBlock()+'<div class="card"><h2>Měsíční nákupní rozpočet</h2><div class="row"><span class="muted">Zbývá tento měsíc</span><strong style="font-size:23px">'+money(remaining())+'</strong></div><div class="bar"><div style="width:'+Math.min(100,100*spent/Math.max(1,limit))+'%"></div></div><div class="row small"><span>Utraceno '+money(spent)+'</span><span>Limit '+money(limit)+'</span></div><div class="divider"></div><div class="row"><span class="muted">BTC v portfoliu</span><strong>'+(a.alloc===null?'—':fmt(a.alloc,1)+' %')+'</strong></div><p class="small">'+limitNote+'</p><button class="btn secondary full" data-goto="settings">Změnit limity a citlivost</button></div><div class="card"><h2>Proč vzniká signál?</h2><div class="radar-indicator"><span>Práh za 7 dní</span><strong>−'+a.thresholds[0]+' %</strong></div><div class="radar-indicator"><span>Práh za 30 dní</span><strong>−'+a.thresholds[1]+' %</strong></div><div class="radar-indicator"><span>Skutečná 7denní změna</span><strong>'+(a.chg7===null?'Chybí data':fmt(a.chg7,2)+' %')+'</strong></div><div class="radar-indicator"><span>Skutečná 30denní změna</span><strong>'+(a.chg30===null?'Chybí data':fmt(a.chg30,2)+' %')+'</strong></div><div class="radar-warning">Aktuální webová verze neumí posílat push oznámení při zavřené aplikaci. Radar neprovádí nákupy. Poplatky Revolutu a případné další poklesy mohou nákup zásadně ovlivnit.</div></div>','BTC Radar','Cenová korekce, pravidla a kontrola rizika.');document.getElementById('btcRefresh').onclick=async()=>{await refreshPrice();await refreshHistory(true)};attachGoto();bindCharts()}
function future(){let s=state.settings,m=s.etfPlan+s.btcBudget,years=s.targetYears,r=Math.pow(1+s.annualReturn/100,1/12)-1,n=years*12,v=r?m*(Math.pow(1+r,n)-1)/r:m*n,real=v/Math.pow(1+s.inflation/100,years);const examples=[10,15,20,25].map(y=>{const n=y*12,z=r?m*(Math.pow(1+r,n)-1)/r:m*n;return'<div class="radar-indicator"><span>'+y+' let · Vklady '+money(m*n)+'</span><strong>'+money(z)+'</strong></div>'}).join('');shell('<div class="hero"><div class="eyebrow">TVŮJ DLOUHODOBÝ PLÁN</div><div class="summary-kicker" style="margin-top:14px">Modelová hodnota za '+years+' let</div><div class="big">'+money(v)+'</div><span class="pill">Hypoteticky '+fmt(s.annualReturn,1)+' % ročně</span><div class="metric-grid"><div class="metric-tile"><label>Celkem vloženo</label><strong>'+money(m*n)+'</strong></div><div class="metric-tile"><label>Dnešní kupní síla</label><strong>'+money(real)+'</strong></div></div></div><div class="card"><h2>Vývoj při stejném výnosu</h2>'+examples+'<p class="chart-note">Model předpokládá neměnný roční výnos i pravidelné měsíční vklady. Není to prognóza cen Bitcoinu nebo ETF.</p></div><div class="card"><h2>Možné měsíční čerpání</h2><div class="metric-grid"><div class="metric-tile"><label>3 % ročně</label><strong>'+money(v*.03/12)+'</strong></div><div class="metric-tile"><label>4 % ročně</label><strong>'+money(v*.04/12)+'</strong></div></div><div class="radar-warning">To nejsou garantované dividendy ani bezpečný výnos. Čerpání může postupně snižovat kapitál. Výrazná expozice BTC zvyšuje riziko.</div><button class="btn secondary full" data-goto="settings" style="margin-top:15px">Upravit předpoklady</button></div>','Budoucnost','Co může přinést dlouhodobé investování.');attachGoto()}
function settings(){let s=state.settings;shell(`<form id="settingsForm"><div class="card"><h2>Investiční plán</h2><div class="cols"><div class="field"><label>ETF měsíčně (Kč)</label><input name="etfPlan" inputmode="numeric" type="number" min="0" value="${s.etfPlan}"></div><div class="field"><label>BTC měsíční limit (Kč)</label><input name="btcBudget" inputmode="numeric" type="number" min="0" value="${s.btcBudget}"></div></div><div class="field"><label>Maximální BTC v portfoliu (%)</label><input name="maxAllocation" type="number" min="1" max="100" value="${s.maxAllocation}"></div></div><div class="card"><h2>BTC Radar</h2><div class="field"><label>Citlivost</label><select name="sensitivity"><option value="active" ${s.sensitivity==='active'?'selected':''}>Aktivní</option><option value="balanced" ${s.sensitivity==='balanced'?'selected':''}>Vyvážená</option><option value="conservative" ${s.sensitivity==='conservative'?'selected':''}>Opatrná</option></select></div><p class="small">Nastavení je připravené pro online vyhodnocování; v této lokální verzi nejsou push notifikace na pozadí.</p></div><div class="card"><h2>Dlouhodobé modely</h2><div class="field"><label>Horizont v letech</label><input name="targetYears" type="number" min="1" max="50" value="${s.targetYears}"></div><div class="cols"><div class="field"><label>Očekávaný modelový výnos (%)</label><input name="annualReturn" type="number" min="-20" max="25" step=".5" value="${s.annualReturn}"></div><div class="field"><label>Inflace (%)</label><input name="inflation" type="number" min="0" max="20" step=".5" value="${s.inflation}"></div></div></div><div class="card"><h2>Tržní ocenění</h2><div class="field"><label>Cena jednoho podílu SPYI (CZK) – ručně</label><input name="spyPrice" inputmode="decimal" value="${state.quotes.SPYI?.price||''}" placeholder="Zadej cenu z Revolutu v Kč"></div><p class="small">Bez ověřeného burzovního zdroje nechceme ukazovat nesprávné ocenění SPYI.</p></div><button class="btn full" type="submit">Uložit nastavení</button></form><div class="card"><h2>Moje data</h2><p class="small">Zálohuj si data, protože jsou uložená jen v tomto prohlížeči a mohou zmizet při vymazání dat Safari.</p><button class="btn secondary full" id="backup">Exportovat zálohu JSON</button><div style="height:10px"></div><input type="file" id="restoreFile" accept=".json,application/json" style="display:none"><button class="btn secondary full" id="restore">Obnovit zálohu JSON</button><div class="divider"></div><button class="btn secondary full" id="clear">Vymazat lokální data</button></div>`,'Nastavení','Investiční limity, pravidla a kontrola dat.');document.getElementById('settingsForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);for(let k of ['etfPlan','btcBudget','maxAllocation','targetYears','annualReturn','inflation']){let n=Number(f.get(k));if(!Number.isFinite(n)||((k==='etfPlan'||k==='btcBudget')&&n<0)){alert('Neplatné nastavení.');return}s[k]=n}s.sensitivity=f.get('sensitivity');let spy=parseNumber(f.get('spyPrice'));state.quotes.SPYI=spy>0?{price:spy,manual:true}:null;save();render();alert('Nastavení uloženo v tomto zařízení.')};document.getElementById('backup').onclick=()=>download('investfolio-zaloha.json',JSON.stringify(state,null,2),'application/json');document.getElementById('restore').onclick=()=>document.getElementById('restoreFile').click();document.getElementById('restoreFile').onchange=async e=>{try{let j=JSON.parse(await e.target.files[0].text());if(!Array.isArray(j.transactions)||!j.settings)throw Error('Neplatná záloha');if(confirm('Nahradit dosavadní lokální data zálohou?')){state={...state,...j,settings:{...defaults,...j.settings}};save();render()}}catch{alert('Nepodařilo se načíst zálohu.')}};document.getElementById('clear').onclick=()=>{if(confirm('Opravdu smazat všechny lokální investice a nastavení?')){localStorage.removeItem(KEY);state={settings:{...defaults},transactions:[],cashMovements:[],quotes:{BTC:null,SPYI:null},updated:null};render()}}}
function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function attachGoto(){document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{page=b.dataset.goto;render()})}async function refreshPrice(){try{let r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=czk',{cache:'no-store'});if(!r.ok)throw Error('API nedostupné');let j=await r.json(),p=j.bitcoin?.czk;if(!(p>0))throw Error('Cena chybí');state.quotes.BTC={price:p,at:new Date().toISOString()};state.updated=new Date().toISOString();save();render()}catch(e){alert('Nepodařilo se načíst cenu BTC. Zkontroluj internet nebo otevři aplikaci později. '+e.message)}}function render(){if(page==='home')home();if(page==='portfolio')portfolio();if(page==='radar')radar();if(page==='future')future();if(page==='settings')settings()}render();refreshHistory();})();
</script></body></html>
